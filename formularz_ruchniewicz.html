<!DOCTYPE html>
<html lang="pl-PL">
<head>
<meta charset="utf-8">
<title>Formularz Ruchniewicz</title>
</head>
<body bgcolor="#87CEFA">
<center><h1>Ankieta społeczna</h1></center>
<form>
<table width="100%" height="850" cellpadding="8">
<tr height="90">
<td width="35%"><b>Wybierz płeć:</b></td>
<td width="40%"><b>W jakim jesteś przedziale wieku?</b></td>
</tr>
<tr height="100">
<td>
<select name="plec">
<option value="kobieta">Kobieta</option>
<option value="mezczyzna" selected>Mężczyzna</option>
<option value="nie_podaje">Nie chcę podawać</option>
</select>
</td>
<td>
<input type="radio" name="wiek" value="dzieci"> dzieci<br><br>
<input type="radio" name="wiek" value="mlodosc"> wczesna młodość<br><br>
<input type="radio" name="wiek" value="7-22"> 7–22 lata<br><br>
<input type="radio" name="wiek" value="22-68"> 22–68 lat
</td>
</tr>
<tr height="100">
<td><b>Data urodzenia:</b></td>
<td><b>Wpisz swój wzrost:</b></td>
</tr>
<tr height="80">
<td><input type="text" name="data_urodzenia" value="2011" size="20"></td>
<td><input type="text" name="wzrost" value="176" size="20"> cm</td>
</tr>
<tr height="100">
<td><b>Wpisz swój ulubiony deser:</b></td>
<td><b>Dodatkowe uwagi:</b></td>
</tr>
<tr height="150">
<td><input type="text" name="deser" value="Sernik" size="30"></td>
<td><textarea name="uwagi" rows="6" cols="35"></textarea></td>
</tr>
<tr height="100">
<td></td>
<td><input type="submit" value="Submit"> <input type="reset" value="Wyczyść"></td>
</tr>
</table>
</form>
</body>
</html>
